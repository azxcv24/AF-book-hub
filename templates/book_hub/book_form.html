{% extends "portal/base.html" %}

{% block title %}{{ title|default:"책" }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h1 class="h3 mb-4">{{ title|default:"책" }}</h1>

    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <a href="{% url 'book_hub:book_list' %}" class="btn btn-outline-secondary">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
